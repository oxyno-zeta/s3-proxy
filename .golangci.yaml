version: "2"
run:
  go: "1.27"
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: false
  timeout: 10m
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
    code-climate:
      path: gl-code-quality-report.json
  path-prefix: ""
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - errchkjson
    - errname
    - exhaustive
    - forcetypeassert
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - inamedparam
    - mirror
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - perfsprint
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - unqueryvet
    - iotamixing
    - modernize
  disable:
    - depguard
    - err113
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gocognit
    - gocyclo
    - interfacebloat
    - ireturn
    - maintidx
    - nestif
    - prealloc
    - testpackage
    - varnamelen
    - zerologlint
    - noinlineerr
    - lll
    - funcorder
    - goconst
  settings:
    godox:
      # report any comments starting with keywords, this is useful for TODO or FIXME comments that
      # might be left in the code accidentally and should be resolved before merging
      keywords: # default keywords are TODO, BUG, and FIXME, these can be overwritten by this setting
        - BUG
        - FIXME
        # - NOTE
        # - OPTIMIZE # marks code that should be optimized before merging
        # - HACK # marks hack-arounds that should be removed before merging
    gosec:
      # To select a subset of rules to run.
      # Available rules: https://github.com/securego/gosec#available-rules
      # Default: [] - means include all rules
      includes: []
    govet:
      enable-all: true
    tagalign:
      align: true
      sort: true
      order:
        - mapstructure
        - gorm
        - validate
        - binding
        - json
        - yaml
        - yml
        - toml
    testpackage:
      skip-regexp: _test\.go
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - nlreturn
          - wsl_v5
        path: pkg/s3-proxy/.*/.*/mocks/.*\.go
      - linters:
          - nlreturn
          - wsl_v5
        path: pkg/s3-proxy/.*/mocks/.*\.go
      - linters:
          - gomoddirectives
        path: go.mod
      - linters:
          - tagliatelle
        path: pkg/.*/authx/models/oidc-user\.go
      - linters:
          - tagliatelle
        path: pkg/.*/authx/authorization/opa-server\.go
      - linters:
          - tagliatelle
        path: pkg/.*/config/config\.go
      - linters:
          - dupl
        path: pkg/.*/response-handler/handler\.go
    paths:
      - tools/generator/modeltagsgen
      - third_party$
      - builtin$
      - examples$
issues:
  uniq-by-line: true
  fix: true
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info
formatters:
  enable:
    - gofmt
    - goimports
    - gci
    - gofumpt
    - golines
  settings:
    gofumpt:
      # Choose whether to use the extra rules.
      # Default: false
      extra-rules: true
    gofmt:
      simplify: true
      # Apply the rewrite rules to the source before reformatting.
      # https://pkg.go.dev/cmd/gofmt
      # Default: []
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
    golines:
      max-len: 160
      # Shorten single-line comments.
      # Default: false
      shorten-comments: true
    gci:
      # Section configuration to compare against.
      # Section names are case-insensitive and may contain parameters in ().
      # The default order of sections is `standard > default > custom > blank > dot > alias > localmodule`.
      # If `custom-order` is `true`, it follows the order of `sections` option.
      # Default: ["standard", "default"]
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/oxyno-zeta) # Custom section: groups all imports with the specified Prefix.
        - blank # Blank section: contains all blank imports. This section is not present unless explicitly enabled.
        - dot # Dot section: contains all dot imports. This section is not present unless explicitly enabled.
        - alias # Alias section: contains all alias imports. This section is not present unless explicitly enabled.
        - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled.
      # Checks that no inline comments are present.
      # Default: false
      no-inline-comments: true
      # Checks that no prefix comments (comment lines above an import) are present.
      # Default: false
      no-prefix-comments: true
      # Enable custom order of sections.
      # If `true`, make the section order the same as the order of `sections`.
      # Default: false
      custom-order: true
      # Drops lexical ordering for custom sections.
      # Default: false
      no-lex-order: true
  exclusions:
    generated: lax
    paths:
      - tools/generator/modeltagsgen
      - third_party$
      - builtin$
      - examples$
